# Directory-picker composition for Pocket Kit, plus this package's own
# Host/Client plugin body (the small-feature collection).
#
# dsh-web-app composes `directory-picker` as
# @deepseek-ai/dsh-host-directory-picker-auto, which samples the host once per
# boot (bind host, remote-authority trust, SSH launch, display) and mounts
# either the native OS chooser or the in-app browser. A Clash fake-ip / proxy
# that changes the effective loopback or bind facts can therefore flip the
# interaction between launches — the reported symptom is "Add workspace"
# suddenly opening Finder instead of the built-in file manager.
#
# The stock row is disabled here so exactly one interaction is mounted. Which
# one is chosen by the `pinBrowsePicker` switch in lib/features, during Host
# boot: the pinned browse pair when it is on (the default), or a fresh mount of
# the stock auto selector when it is off. Both are ordinary Loader entries; the
# pair must be mounted together, because the Client surface has to be a row
# when the page's boot graph is composed.

- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-auto'
  disabled: true

- insert:
    # This package's own plugin body: the small-feature collection. Its Host
    # half installs the enabled features (lib/index.js + lib/features/*) and,
    # with them, the directory-picker composition above; its `dsh.client`
    # entry contributes the Settings page with one switch per feature.
    - id: dsh-pocket-kit
      name: dsh-pocket-kit
